<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 8 Task 4</title>
    <link rel="stylesheet" href="../css/task4.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="colours">
        <h2> Select a colour</h2>
    </div>

    <div id="fruits">
        <ul> Fruits:</ul>
    </div>
</body>
<script type="module" src="../js/task4.js"></script>
    <script>
        $(document).ready(function(){
            $(".btnColour").click(function(){

                let colour = $(this).css("background-color");
                let selectedFruits = $(".fruitItem").filter(function(){
                    return $(this).css("background-color") === colour;
                });


                selectedFruits.css("box-shadow", "6px 6px 9px grey");


            });

            $("span").click(function(){
                $(this).text("★");
                $(this).prevAll("span").text("★");
                $(this).nextAll("span").text("☆");

            })
        });
    </script>
</html>
